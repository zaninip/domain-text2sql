[project]
name = "t2sql"
version = "0.1.0"
description = "Text-to-SQL on French electricity data: fine-tuned vs base LLM"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Paolo Zanini" }]
dependencies = [
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "sqlglot>=30.18.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t2sql"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ANN", # flake8-annotations (type hints everywhere)
    "RUF", # ruff-specific
]
ignore = [
    "ANN401", # allow typing.Any in signatures
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
