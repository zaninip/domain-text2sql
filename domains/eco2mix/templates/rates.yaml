# Family "rate": a ratio between two aggregates, expressed as a percentage.
# The templates come in contrast pairs: one word apart in the question ("consumption" or
# "production", "share" or "average coverage rate"), a different formula in the answer.

templates:
  - template_id: rate_coverage_national_month_moment
    family: rate
    conventions: [national_aggregate, coverage_rate, peak_hours]
    description: >
      Coverage rate of one source over France during one part of the day or week, for one
      month. The trap is `AVG(tco_x_pct)`: the question has no region, so the answer is the
      national ratio of sums, and averaging a per-region rate would be wrong.

    slots:
      mesure:
        from: measures
        keep: {kind: production}
      mois:
        from: months
      moment:
        from: moments
      annee:
        range: [2020, 2025]   # tco_* columns exist from 2020: the wrong answer is not NULL

    max_instances: 60

    # Words that keep the variants on this template's meaning: the whole of France, which is
    # what makes it a ratio of sums and not the average of a regional indicator.
    must_say:
      fr: ["France", "national*", "français*"]
      it: ["Francia", "nazional*", "frances*"]

    questions:
      fr:
        - "Quel a été le taux de couverture moyen {mesure.de} {moment.in} {mois.in} {annee} en France ?"
        - "En France, quelle part de la consommation a été couverte par l'énergie {mesure} {moment.in} {mois.in} {annee} ?"
        - "Donne-moi le taux de couverture moyen {mesure.de} en France {moment.in} {mois.in} {annee}."
        - "France, {mois} {annee} : quelle part de la consommation {moment.in} a été couverte par l'énergie {mesure} ?"
        - "Au niveau national, quelle a été la couverture de la consommation par l'énergie {mesure} {moment.in} {mois.in} {annee} ?"
        - "Couverture de la consommation française par l'énergie {mesure} {moment.in} {mois.in} {annee} ?"
      it:
        - "Qual è stato il tasso di copertura medio {mesure.de} {moment.in} {mois.in} {annee} in Francia?"
        - "In Francia, quale parte del consumo è stata coperta dall'energia {mesure} {moment.in} {mois.in} {annee}?"
        - "Dammi il tasso di copertura medio {mesure.de} in Francia {moment.in} {mois.in} {annee}."
        - "Francia, {mois} {annee}: quale parte del consumo {moment.in} è stata coperta dall'energia {mesure}?"
        - "A livello nazionale, qual è stata la copertura {mesure} del consumo {moment.in} {mois.in} {annee}?"
        - "Copertura {mesure} del consumo francese {moment.in} {mois.in} {annee}?"

    sql: |
      SELECT 100.0 * SUM({mesure.sql}) / SUM(consommation_mw) AS taux_couverture_pct
      FROM eco2mix
      WHERE annee = {annee} AND mois = {mois.id} AND {moment.where}

    result:
      columns: [taux_couverture_pct]
      order_matters: false

  - template_id: rate_share_source_consumption_region_year
    family: rate
    conventions: [share_ratio_of_sums]
    description: >
      Share of a region's consumption covered by one source over a year: the ratio of the two
      sums. Twin of the average coverage rate below, where similar words ask for the average
      of the published indicator instead.

    slots:
      mesure:
        from: measures
        keep: {kind: production}
      region:
        from: regions
      annee:
        range: [2013, 2025]

    max_instances: 20

    # Words that keep the variants on this template's meaning: share in consumption, not in production, nor the average coverage rate.
    must_say:
      fr: ["consommation"]
      it: ["consumo"]
    must_not_say:
      fr: ["taux de couverture", "production totale"]
      it: ["tasso di copertura", "totale prodotto"]

    questions:
      fr:
        - "Quelle part de la consommation {region.in} a été couverte par l'énergie {mesure} en {annee}, en % ?"
        - "Part {mesure.de} dans la consommation {region.in} en {annee} ?"
        - "Quel pourcentage de la consommation électrique {region.in} l'énergie {mesure} a-t-elle couvert en {annee} ?"
        - "Donne-moi la part {mesure.de} dans la consommation {region.in} en {annee}."
        - "{region.in} en {annee} : combien de pour cent de la consommation l'énergie {mesure} a-t-elle couvert ?"
        - "Sur la consommation {region.in} en {annee}, quel pourcentage l'énergie {mesure} a-t-elle représenté ?"
      it:
        - "Quale quota del consumo {region.in} è stata coperta dall'energia {mesure} nel {annee}, in %?"
        - "Quota {mesure.de} nel consumo {region.in} nel {annee}?"
        - "Che percentuale del consumo elettrico {region.in} ha coperto l'energia {mesure} nel {annee}?"
        - "Dammi la quota {mesure.de} nel consumo {region.in} nel {annee}."
        - "{region.in} nel {annee}: quanti per cento del consumo ha coperto l'energia {mesure}?"
        - "Sul consumo {region.in} nel {annee}, che percentuale ha rappresentato l'energia {mesure}?"

    require: |
      SELECT count(DISTINCT {mesure.sql}) > 1
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}

    sql: |
      SELECT 100.0 * SUM({mesure.sql}) / SUM(consommation_mw) AS part_pct
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}

    result:
      columns: [part_pct]
      order_matters: false

  - template_id: rate_share_source_production_region_year
    family: rate
    conventions: [share_ratio_of_sums, total_production]
    description: >
      Share of one source in a region's own production over a year. The denominator is the sum
      of the six sources (with COALESCE), not consumption: one word apart from the template
      above, a different answer.

    slots:
      mesure:
        from: measures
        keep: {kind: production}
      region:
        from: regions
      annee:
        range: [2013, 2025]

    max_instances: 20

    # Words that keep the variants on this template's meaning: share in production, not in consumption.
    must_say:
      fr: ["production"]
      it: ["produzione", "prodotto"]
    must_not_say:
      fr: ["consommation", "taux de couverture"]
      it: ["consumo", "tasso di copertura"]

    questions:
      fr:
        - "Quelle a été la part {mesure.de} dans la production électrique {region.in} en {annee} ?"
        - "Part {mesure.de} dans la production {region.in} en {annee} ?"
        - "En pourcentage, quel a été le poids de la production {mesure} dans la production totale {region.in} en {annee} ?"
        - "Donne-moi la part {mesure.de} dans la production {region.in} en {annee}."
        - "{region.in} en {annee} : quel pourcentage de la production revient à l'énergie {mesure} ?"
        - "Sur la production totale {region.in} en {annee}, quelle fraction est {mesure} ?"
      it:
        - "Qual è stata la quota {mesure.de} nella produzione elettrica {region.in} nel {annee}?"
        - "Quota {mesure.de} nella produzione {region.in} nel {annee}?"
        - "In percentuale, quanto ha pesato la produzione {mesure} sul totale prodotto {region.in} nel {annee}?"
        - "Dammi la quota {mesure.de} nella produzione {region.in} nel {annee}."
        - "{region.in} nel {annee}: che percentuale della produzione spetta all'energia {mesure}?"
        - "Sulla produzione totale {region.in} nel {annee}, che frazione è {mesure}?"

    require: |
      SELECT count(DISTINCT {mesure.sql}) > 1
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}

    sql: |
      SELECT 100.0 * SUM({mesure.sql})
             / SUM(COALESCE(thermique_mw, 0) + COALESCE(nucleaire_mw, 0) + COALESCE(eolien_mw, 0)
                   + COALESCE(solaire_mw, 0) + COALESCE(hydraulique_mw, 0)
                   + COALESCE(bioenergies_mw, 0)) AS part_pct
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}

    result:
      columns: [part_pct]
      order_matters: false

  - template_id: rate_avg_coverage_indicator_region_year
    family: rate
    conventions: [coverage_indicator_average]
    description: >
      Average of RTE's coverage indicator (TCO) for one source in one region over a year.
      "Average coverage rate" of a region reads the published indicator (glossary §5); the
      national version of the question is a ratio of sums instead. Available from 2020.

    slots:
      mesure:
        from: measures
        keep: {kind: production}
      region:
        from: regions
      annee:
        range: [2020, 2025]

    max_instances: 20

    # Words that keep the variants on this template's meaning: the published coverage rate averaged, not a share of totals.
    must_say:
      fr: ["taux de couverture"]
      it: ["tasso di copertura"]
    # "en pourcentage" / "in percentuale" stay allowed: the indicator is a percentage. What is
    # forbidden is the share template's wording, "quel pourcentage de la consommation".
    must_not_say:
      fr: ["part", "pourcentage de", "pourcentage du", "charge"]
      it: ["quota", "percentuale del", "percentuale di", "carico"]

    questions:
      fr:
        - "Quel a été le taux de couverture moyen {mesure.de} {region.in} en {annee} ?"
        - "Taux de couverture moyen {mesure.de} {region.in} sur l'année {annee} ?"
        - "En {annee}, quel a été en moyenne le taux de couverture {mesure.de} {region.in} ?"
        - "Donne-moi le taux de couverture moyen {mesure.de} {region.in} en {annee}."
        - "{region.in} en {annee} : à combien s'est établi le taux de couverture moyen {mesure.de} ?"
        - "Moyenne annuelle du taux de couverture {mesure.de} {region.in} en {annee} ?"
      it:
        - "Qual è stato il tasso di copertura medio {mesure.de} {region.in} nel {annee}?"
        - "Tasso di copertura medio {mesure.de} {region.in} nell'anno {annee}?"
        - "Nel {annee}, qual è stato in media il tasso di copertura {mesure.de} {region.in}?"
        - "Dammi il tasso di copertura medio {mesure.de} {region.in} nel {annee}."
        - "{region.in} nel {annee}: a quanto si è attestato il tasso di copertura medio {mesure.de}?"
        - "Media annuale del tasso di copertura {mesure.de} {region.in} nel {annee}?"

    require: |
      SELECT count(DISTINCT {mesure.sql}) > 1
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}

    sql: |
      SELECT AVG({mesure.tco}) AS taux_couverture_moyen_pct
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}

    result:
      columns: [taux_couverture_moyen_pct]
      order_matters: false

  - template_id: rate_avg_load_factor_region_year
    family: rate
    conventions: [load_factor_average]
    description: >
      Average load factor (TCH) of one source in one region over a year. Installed capacity is
      not in the data, so the published indicator is the only way; available from 2020 and
      NULL where the region has no such plant.

    slots:
      mesure:
        from: measures
        keep: {kind: production}
      region:
        from: regions
      annee:
        range: [2020, 2025]

    max_instances: 20

    # Words that keep the variants on this template's meaning: load factor, not coverage.
    must_say:
      fr: ["charge"]
      it: ["carico"]
    must_not_say:
      fr: ["couverture"]
      it: ["copertura"]

    questions:
      fr:
        - "Quel a été le facteur de charge moyen {mesure.de} {region.in} en {annee} ?"
        - "Taux de charge moyen {mesure.de} {region.in} sur l'année {annee} ?"
        - "En {annee}, quel a été en moyenne le taux de charge {mesure.de} {region.in} ?"
        - "Donne-moi le facteur de charge moyen {mesure.de} {region.in} en {annee}."
        - "{region.in} en {annee} : à combien s'est établi le facteur de charge moyen {mesure.de} ?"
        - "Moyenne annuelle du facteur de charge {mesure.de} {region.in} en {annee} ?"
      it:
        - "Qual è stato il fattore di carico medio {mesure.de} {region.in} nel {annee}?"
        - "Tasso di carico medio {mesure.de} {region.in} nell'anno {annee}?"
        - "Nel {annee}, qual è stato in media il fattore di carico {mesure.de} {region.in}?"
        - "Dammi il fattore di carico medio {mesure.de} {region.in} nel {annee}."
        - "{region.in} nel {annee}: a quanto si è attestato il fattore di carico medio {mesure.de}?"
        - "Media annuale del fattore di carico {mesure.de} {region.in} nel {annee}?"

    require: |
      SELECT count(DISTINCT {mesure.tch}) > 1
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}

    sql: |
      SELECT AVG({mesure.tch}) AS taux_charge_moyen_pct
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}

    result:
      columns: [taux_charge_moyen_pct]
      order_matters: false

  - template_id: rate_region_share_national_consumption_year
    family: rate
    conventions: [region_share_of_national, national_aggregate]
    description: >
      Weight of one region in French consumption over a year. The region appears only in the
      numerator (FILTER); filtering it in WHERE would divide the region by itself and always
      answer 100 %.

    slots:
      region:
        from: regions
      annee:
        range: [2013, 2025]

    max_instances: 20

    questions:
      fr:
        - "Quelle part de la consommation électrique française représente la région {region} en {annee} ?"
        - "Part de la région {region} dans la consommation nationale en {annee} ?"
        - "En {annee}, quel pourcentage de la consommation de la France provenait de la région {region} ?"
        - "Donne-moi le poids de la région {region} dans la consommation nationale en {annee}."
        - "En {annee}, combien de pour cent de la consommation française la région {region} pèse-t-elle ?"
        - "Sur la consommation de la France en {annee}, quelle fraction revient à la région {region} ?"
      it:
        - "Quale quota del consumo elettrico francese rappresenta la regione {region} nel {annee}?"
        - "Quota della regione {region} nel consumo nazionale nel {annee}?"
        - "Nel {annee}, che percentuale del consumo della Francia è venuta dalla regione {region}?"
        - "Dammi il peso della regione {region} nel consumo nazionale nel {annee}."
        - "Nel {annee}, quanti per cento del consumo francese pesa la regione {region}?"
        - "Sul consumo della Francia nel {annee}, che frazione spetta alla regione {region}?"

    sql: |
      SELECT 100.0 * SUM(consommation_mw) FILTER (WHERE region = {region.literal})
             / SUM(consommation_mw) AS part_pct
      FROM eco2mix
      WHERE annee = {annee}

    result:
      columns: [part_pct]
      order_matters: false

  - template_id: rate_offshore_share_wind_region_year
    family: rate
    conventions: [offshore_share, share_ratio_of_sums]
    description: >
      Share of offshore wind in a region's wind production. The split exists from 2024 only,
      and the denominator is `eolien_mw`, which the source does not keep exactly equal to
      onshore + offshore (glossary §5).

    slots:
      region:
        from: regions
      annee:
        range: [2024, 2026]   # 2026 is partial (January-June), still a valid "this year"

    max_instances: 20

    # Words that keep the variants on this template's meaning: offshore share, not total wind.
    must_say:
      fr: ["offshore", "en mer"]
      it: ["offshore", "in mare"]

    questions:
      fr:
        - "Quelle part de la production éolienne {region.in} était offshore en {annee} ?"
        - "Part de l'éolien en mer dans l'éolien total {region.in} en {annee} ?"
        - "En {annee}, quel pourcentage de l'électricité éolienne produite {region.in} venait de l'offshore ?"
        - "Donne-moi la part de l'offshore dans la production éolienne {region.in} en {annee}."
        - "{region.in} en {annee} : quelle fraction de l'éolien venait des parcs en mer ?"
        - "Poids de l'éolien offshore dans l'éolien {region.in} en {annee} ?"
      it:
        - "Quale quota della produzione eolica {region.in} era offshore nel {annee}?"
        - "Quota dell'eolico offshore sull'eolico totale {region.in} nel {annee}?"
        - "Nel {annee}, che percentuale dell'energia eolica prodotta {region.in} veniva dall'offshore?"
        - "Dammi la quota dell'offshore nella produzione eolica {region.in} nel {annee}."
        - "{region.in} nel {annee}: che frazione dell'eolico veniva dai parchi offshore?"
        - "Peso dell'eolico offshore sull'eolico {region.in} nel {annee}?"

    sql: |
      SELECT 100.0 * SUM(eolien_offshore_mw) / SUM(eolien_mw) AS part_offshore_pct
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}

    result:
      columns: [part_offshore_pct]
      order_matters: false
