# Family "extremes": the highest or lowest 30-minute value, and when it happened.

templates:
  - template_id: ext_peak_timestamp_region_year
    family: extremes
    conventions: [extremum_with_timestamp, tie_break, result_shape]
    description: >
      When the peak (or the low) of one measure was reached in a region over a year. Asking
      "when" forbids `MAX(...)`: the answer needs the instant. Several instants can share the
      extreme value (up to 1371 times in this data), so the answer is the earliest one plus
      the number of instants that reach it, never an arbitrary row (glossary §8).

    slots:
      mesure:
        from: measures
        keep: {kind: [production, demand]}
      extremum:
        values:
          # Real questions are about the peak; the low is asked for rarely, so it keeps a
          # small share instead of half the instances.
          - {id: max, label: {fr: le pic, it: il picco}, agg: max, weight: 1.0}
          - {id: min, label: {fr: le minimum, it: il minimo}, agg: min, weight: 0.15}
      region:
        from: regions
      annee:
        range: [2013, 2025]

    max_instances: 60

    # MOST DANGEROUS PAIR of the project, with ext_record_day_production_region_year: this one
    # asks for the INSTANT of the power peak, the other for the DAY with the largest daily
    # total. Every variant names the instant ("quand", "à quel moment / instant", "à quelle
    # heure"). Never write "Quand la production … a-t-elle été la plus forte", which fits both.
    must_say:
      fr: ["quand", "heure", "moment", "instant"]
      it: ["quando", "ora", "momento", "istante"]

    questions:
      fr:
        - "Quand a été atteint {extremum} {mesure.de} {region.in} en {annee} ?"
        - "À quelle date et à quelle heure {extremum} {mesure.de} a-t-il été atteint {region.in} en {annee} ?"
        - "Donne-moi le moment où a été atteint {extremum} {mesure.de} {region.in} en {annee}."
        - "{extremum} {mesure.de} {region.in} en {annee} : à quel moment ?"
        - "En {annee} {region.in}, à quel instant a-t-on enregistré {extremum} {mesure.de} ?"
      it:
        - "Quando è stato raggiunto {extremum} {mesure.de} {region.in} nel {annee}?"
        - "In che giorno e a che ora è stato raggiunto {extremum} {mesure.de} {region.in} nel {annee}?"
        - "Dammi il momento in cui è stato raggiunto {extremum} {mesure.de} {region.in} nel {annee}."
        - "{extremum} {mesure.de} {region.in} nel {annee}: in che momento?"
        - "Nel {annee} {region.in}, in quale istante è stato registrato {extremum} {mesure.de}?"

    # A source the region does not have is stored as 0 (or NULL) at every step: the question
    # "when was its minimum" then has no meaning. Require the measure to vary.
    require: |
      SELECT count(DISTINCT {mesure.sql}) > 1
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}

    sql: |
      WITH v AS (
        SELECT date_heure, {mesure.sql} AS valeur_mw
        FROM eco2mix
        WHERE region = {region.literal} AND annee = {annee}
      )
      SELECT min(date_heure) AS date_heure, valeur_mw, count(*) AS ex_aequo
      FROM v
      WHERE valeur_mw = (SELECT {extremum.agg}(valeur_mw) FROM v)
      GROUP BY valeur_mw

    result:
      columns: [date_heure, valeur_mw, ex_aequo]
      order_matters: false

  - template_id: ext_national_extremum_value_year
    family: extremes
    conventions: [national_per_instant, extremum_value, power_units]
    description: >
      The highest (or lowest) national consumption of a year, as a value only. The national
      value exists once the twelve regions are summed per instant; MAX over the regional rows
      would return one region's peak. No "when", so MAX is enough (glossary §8).

    slots:
      extremum:
        values:
          - {id: max, label: {fr: le pic, it: il picco}, agg: max, weight: 1.0}
          - {id: min, label: {fr: le minimum, it: il minimo}, agg: min, weight: 0.15}
      annee:
        range: [2013, 2025]
      unite:
        from: power_units

    max_instances: 20

    # Words that keep the variants on this template's meaning: the value only: asking when would need the instant.
    must_not_say:
      fr: ["quand", "date", "heure"]
      it: ["quando", "ora"]

    questions:
      fr:
        - "Quel a été {extremum} de la consommation nationale en {annee}{unite.suffix} ?"
        - "En {annee}, quel a été {extremum} de la consommation électrique française{unite.suffix} ?"
        - "Consommation nationale en {annee} : quel a été {extremum}{unite.suffix} ?"
        - "Donne-moi {extremum} de la consommation nationale en {annee}{unite.suffix}."
        - "{extremum} de consommation en France en {annee}{unite.suffix} ?"
        - "À combien s'est élevé {extremum} de la consommation nationale en {annee}{unite.suffix} ?"
      it:
        - "Qual è stato {extremum} del consumo nazionale nel {annee}{unite.suffix}?"
        - "Nel {annee}, qual è stato {extremum} del consumo elettrico francese{unite.suffix}?"
        - "Consumo nazionale nel {annee}: qual è stato {extremum}{unite.suffix}?"
        - "Dammi {extremum} del consumo nazionale nel {annee}{unite.suffix}."
        - "{extremum} di consumo in Francia nel {annee}{unite.suffix}?"
        - "A quanto è ammontato {extremum} del consumo nazionale nel {annee}{unite.suffix}?"

    sql: |
      SELECT {extremum.agg}(conso_mw){unite.expr} AS valeur_{unite.id}
      FROM (
        SELECT date_heure, SUM(consommation_mw) AS conso_mw
        FROM eco2mix
        WHERE annee = {annee}
        GROUP BY date_heure
      )

    result:
      columns: [valeur]
      order_matters: false

  - template_id: ext_record_day_production_region_year
    family: extremes
    conventions: [record_day_daily_total, extremum_with_timestamp, tie_break]
    description: >
      The day of a year with the highest production of one source in a region: daily energy
      totals, not the instant of the power peak (compare ext_peak_timestamp_region_year). Asks
      "which day", so the earliest day and the number of days reaching the value are returned.

    slots:
      mesure:
        from: measures
        keep: {kind: production}
      region:
        from: regions
      annee:
        range: [2013, 2025]

    max_instances: 20

    # MOST DANGEROUS PAIR of the project, with ext_peak_timestamp_region_year: this one asks for
    # the DAY with the largest daily total, the other for the INSTANT of the power peak. Every
    # variant says "jour / journée" ("giorno / giornata") and none refers to a time of day or
    # an instant. Never write "Quand la production … a-t-elle été la plus forte", which fits both.
    must_say:
      fr: ["jour", "journée"]
      it: ["giorno", "giornata"]
    must_not_say:
      fr: ["heure", "quand", "moment", "instant"]
      it: ["ora", "quando", "momento", "istante"]

    questions:
      fr:
        - "Quel jour de {annee} la production {mesure} a-t-elle été la plus forte {region.in} ?"
        - "Journée record pour la production {mesure} {region.in} en {annee} ?"
        - "En {annee}, quel a été le jour de plus forte production {mesure} {region.in} ?"
        - "Donne-moi le jour record de production {mesure} {region.in} en {annee}."
        - "Production {mesure} {region.in} : quel a été le meilleur jour de {annee} ?"
        - "En {annee} {region.in}, quelle journée a totalisé la plus forte production {mesure} ?"
      it:
        - "In quale giorno del {annee} la produzione {mesure} è stata più alta {region.in}?"
        - "Giorno record per la produzione {mesure} {region.in} nel {annee}?"
        - "Nel {annee}, qual è stato il giorno di massima produzione {mesure} {region.in}?"
        - "Dammi il giorno record di produzione {mesure} {region.in} nel {annee}."
        - "Produzione {mesure} {region.in}: qual è stata la giornata migliore del {annee}?"
        - "Nel {annee} {region.in}, quale giornata ha totalizzato la produzione {mesure} più alta?"

    require: |
      SELECT count(DISTINCT {mesure.sql}) > 1
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}

    sql: |
      WITH v AS (
        SELECT date, SUM({mesure.sql}) * 0.5 AS energie_mwh
        FROM eco2mix
        WHERE region = {region.literal} AND annee = {annee}
        GROUP BY date
      )
      SELECT min(date) AS date, energie_mwh, count(*) AS ex_aequo
      FROM v
      WHERE energie_mwh = (SELECT max(energie_mwh) FROM v)
      GROUP BY energie_mwh

    result:
      columns: [date, energie_mwh, ex_aequo]
      order_matters: false
