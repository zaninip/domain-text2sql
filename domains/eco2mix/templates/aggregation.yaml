# Family "aggregation": one number summarising a column over a period.

templates:
  - template_id: agg_energy_source_region_year
    family: aggregation
    conventions: [energy_conversion, unit_scaling]
    description: >
      Energy produced by one source, in one region, over one calendar year, in the requested
      unit. Exercises "MW are average power, energy = SUM(MW) * 0.5" and the unit scaling.

    slots:
      mesure:
        from: measures
        keep: {kind: production}
      region:
        from: regions
      annee:
        range: [2013, 2025]    # 2026 is partial, excluded from "one full year" templates
      unite:
        from: energy_units

    max_instances: 35          # sampled with the global seed out of 6 x 12 x 13 x 3 = 2808 combinations

    questions:
      fr:
        - "Quelle quantité d'énergie {mesure} a été produite {region.in} en {annee}{unite.suffix} ?"
        - "Production {mesure} {region.in} sur l'année {annee}{unite.suffix} ?"
        - "{mesure.nom} {region.in} en {annee}{unite.suffix} ?"
        - "Quelle production pour {mesure.le} {region.in} en {annee}{unite.suffix} ?"
        - "Donne-moi la production {mesure} {region.in} en {annee}{unite.suffix}."
        - "Total de l'énergie {mesure} {region.in} pour {annee}{unite.suffix} ?"
      it:
        - "Quanta energia {mesure} è stata prodotta {region.in} nel {annee}{unite.suffix}?"
        - "Produzione {mesure} {region.in} nell'anno {annee}{unite.suffix}?"
        - "{mesure.nom} {region.in} nel {annee}{unite.suffix}?"
        - "Che produzione per {mesure.le} {region.in} nel {annee}{unite.suffix}?"
        - "Dammi la produzione {mesure} {region.in} nel {annee}{unite.suffix}."
        - "Totale dell'energia {mesure} prodotta {region.in} nel {annee}{unite.suffix}?"

    sql: |
      SELECT SUM({mesure.sql}) {unite.expr} AS energie_{unite.id}
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}

    result:
      columns: [energie]
      order_matters: false

  - template_id: agg_energy_measure_region_month
    family: aggregation
    conventions: [energy_conversion, unit_scaling]
    description: >
      Energy produced by one source, in one region, over one calendar month. Same convention
      as the yearly template on a shorter window, where MWh and GWh are the natural units.

    slots:
      mesure:
        from: measures
        keep: {kind: production}
      region:
        from: regions
      mois:
        from: months
      annee:
        range: [2013, 2025]
      unite:
        from: energy_units

    max_instances: 35

    questions:
      fr:
        - "Quelle quantité d'énergie {mesure} a été produite {region.in} {mois.in} {annee}{unite.suffix} ?"
        - "Production {mesure} {region.in} {mois.in} {annee}{unite.suffix} ?"
        - "{mesure.nom} {region.in} {mois.in} {annee}{unite.suffix} ?"
        - "Quelle production {mesure} {region.in} sur le mois de {mois.de} {annee}{unite.suffix} ?"
        - "Donne-moi la production {mesure} {region.in} {mois.in} {annee}{unite.suffix}."
        - "Quelle énergie pour {mesure.le} {region.in} {mois.in} {annee}{unite.suffix} ?"
      it:
        - "Quanta energia {mesure} è stata prodotta {region.in} {mois.in} {annee}{unite.suffix}?"
        - "Produzione {mesure} {region.in} {mois.in} {annee}{unite.suffix}?"
        - "{mesure.nom} {region.in} {mois.in} {annee}{unite.suffix}?"
        - "Produzione {mesure} {region.in} nel mese di {mois} {annee}{unite.suffix}?"
        - "Dammi la produzione {mesure} {region.in} {mois.in} {annee}{unite.suffix}."
        - "Che energia per {mesure.le} {region.in} {mois.in} {annee}{unite.suffix}?"

    sql: |
      SELECT SUM({mesure.sql}) {unite.expr} AS energie_{unite.id}
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee} AND mois = {mois.id}

    result:
      columns: [energie]
      order_matters: false

  - template_id: agg_consumption_national_month
    family: aggregation
    conventions: [energy_conversion, unit_scaling, national_aggregate]
    description: >
      Total electricity consumption of France over one month. No region is named, so the
      answer sums the 12 regions (glossary §5); this is also the figure RTE publishes, which
      makes the template the easiest one to check against the official site.

    slots:
      mois:
        from: months
      annee:
        range: [2013, 2025]
      unite:
        from: energy_units

    max_instances: 35

    # Words that keep the variants on this template's meaning: the month's total, not the daily
    # series of ts_daily_consumption_national_month ("Consommation … quotidienne de la France").
    must_not_say:
      fr: ["jour", "quotidien*", "journali*"]
      it: ["giorno", "giornalier*", "quotidian*"]

    questions:
      fr:
        - "Quelle a été la consommation totale d'électricité en France {mois.in} {annee}{unite.suffix} ?"
        - "Consommation électrique de la France {mois.in} {annee}{unite.suffix} ?"
        - "Consommation France {mois.in} {annee}{unite.suffix} ?"
        - "Combien d'électricité la France a-t-elle consommé {mois.in} {annee}{unite.suffix} ?"
        - "Donne-moi la consommation française {mois.in} {annee}{unite.suffix}."
        - "Quel a été le total consommé en France {mois.in} {annee}{unite.suffix} ?"
      it:
        - "Qual è stato il consumo totale di elettricità in Francia {mois.in} {annee}{unite.suffix}?"
        - "Consumo elettrico della Francia {mois.in} {annee}{unite.suffix}?"
        - "Consumo Francia {mois.in} {annee}{unite.suffix}?"
        - "Quanta elettricità ha consumato la Francia {mois.in} {annee}{unite.suffix}?"
        - "Dammi il consumo francese {mois.in} {annee}{unite.suffix}."
        - "Qual è stato il totale consumato in Francia {mois.in} {annee}{unite.suffix}?"

    sql: |
      SELECT SUM(consommation_mw) {unite.expr} AS energie_{unite.id}
      FROM eco2mix
      WHERE annee = {annee} AND mois = {mois.id}

    result:
      columns: [energie]
      order_matters: false

  - template_id: agg_group_energy_region_month
    family: aggregation
    conventions: [source_groups, energy_conversion, unit_scaling]
    description: >
      Energy of a group of sources (renewable, low-carbon, fossil) in one region over one month.
      Low-carbon includes nuclear, renewable does not, fossil is thermal alone; the groups come
      with synonyms ("pulita", "decarbonizzata") that all map to the same expression.

    slots:
      groupe:
        from: source_groups
      region:
        from: regions
      mois:
        from: months
      annee:
        range: [2013, 2026]   # the months after June 2026 have no data and drop out as all-NULL
      unite:
        from: energy_units

    max_instances: 35

    questions:
      fr:
        - "Quelle quantité d'énergie {groupe} a été produite {region.in} {mois.in} {annee}{unite.suffix} ?"
        - "Production d'énergie {groupe} {region.in} {mois.in} {annee}{unite.suffix} ?"
        - "Quelle a été la production d'énergie {groupe} {region.in} {mois.in} {annee}{unite.suffix} ?"
        - "Énergie {groupe} {region.in} {mois.in} {annee}{unite.suffix} ?"
        - "Donne-moi l'énergie {groupe} produite {region.in} {mois.in} {annee}{unite.suffix}."
        - "Combien d'électricité {groupe} {region.in} {mois.in} {annee}{unite.suffix} ?"
      it:
        - "Quanta energia {groupe} è stata prodotta {region.in} {mois.in} {annee}{unite.suffix}?"
        - "Produzione di energia {groupe} {region.in} {mois.in} {annee}{unite.suffix}?"
        - "Qual è stata la produzione di energia {groupe} {region.in} {mois.in} {annee}{unite.suffix}?"
        - "Energia {groupe} {region.in} {mois.in} {annee}{unite.suffix}?"
        - "Dammi l'energia {groupe} prodotta {region.in} {mois.in} {annee}{unite.suffix}."
        - "Quanta elettricità {groupe} {region.in} {mois.in} {annee}{unite.suffix}?"

    sql: |
      SELECT SUM({groupe.sql}) {unite.expr} AS energie_{unite.id}
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee} AND mois = {mois.id}

    result:
      columns: [energie]
      order_matters: false

  - template_id: agg_group_energy_national_year
    family: aggregation
    conventions: [source_groups, national_aggregate, energy_conversion, unit_scaling]
    description: >
      Energy of a group of sources for the whole of France over a year: the same groups as the
      regional template, without a region filter (glossary §5, no region = national).

    slots:
      groupe:
        from: source_groups
      annee:
        range: [2013, 2025]
      unite:
        from: energy_units

    max_instances: 35

    questions:
      fr:
        - "Quelle quantité d'énergie {groupe} la France a-t-elle produite en {annee}{unite.suffix} ?"
        - "Production nationale d'énergie {groupe} en {annee}{unite.suffix} ?"
        - "Combien d'énergie {groupe} a été produite en France en {annee}{unite.suffix} ?"
        - "Énergie {groupe} en France en {annee}{unite.suffix} ?"
        - "Donne-moi la production d'énergie {groupe} nationale en {annee}{unite.suffix}."
        - "Production d'énergie {groupe} de la France en {annee}{unite.suffix} ?"
      it:
        - "Quanta energia {groupe} ha prodotto la Francia nel {annee}{unite.suffix}?"
        - "Produzione nazionale di energia {groupe} nel {annee}{unite.suffix}?"
        - "Quanta energia {groupe} è stata prodotta in Francia nel {annee}{unite.suffix}?"
        - "Energia {groupe} in Francia nel {annee}{unite.suffix}?"
        - "Dammi la produzione {groupe} nazionale nel {annee}{unite.suffix}."
        - "Produzione {groupe} della Francia nel {annee}{unite.suffix}?"

    sql: |
      SELECT SUM({groupe.sql}) {unite.expr} AS energie_{unite.id}
      FROM eco2mix
      WHERE annee = {annee}

    result:
      columns: [energie]
      order_matters: false

  - template_id: agg_exchange_gross_region_year
    family: aggregation
    conventions: [exchange_sign, gross_exchanges, energy_conversion, unit_scaling]
    description: >
      Gross exports (or imports) of a region over a year: only the steps with the matching
      sign count, and exports are made positive. The net balance would be a different answer
      (glossary §4).

    slots:
      sens:
        # `label` is the past participle after "ha"/"a-t-elle", feminine in French because the
        # object placed before the verb is "quantité"/"énergie"; `m` is the masculine for a
        # masculine object ("quel volume … a-t-elle exporté"); `adj` agrees with "energia".
        values:
          - {id: export, op: "<", sign: "-", label: {fr: exportée, it: esportato}, adj: {fr: exportée, it: esportata}, m: {fr: exporté, it: esportato}}
          - {id: import, op: ">", sign: "", label: {fr: importée, it: importato}, adj: {fr: importée, it: importata}, m: {fr: importé, it: importato}}
      region:
        from: regions
      annee:
        range: [2013, 2025]
      unite:
        from: energy_units

    max_instances: 35

    # Words that keep the variants on this template's meaning: gross exports, not the net balance of the classification and multi-condition templates.
    must_not_say:
      fr: ["net*", "solde"]
      it: ["nett*", "saldo"]

    questions:
      fr:
        - "Quelle quantité d'énergie la région {region} a-t-elle {sens} en {annee}{unite.suffix} ?"
        - "Énergie {sens.adj} par la région {region} en {annee}{unite.suffix} ?"
        - "Combien d'électricité la région {region} a-t-elle {sens} en {annee}{unite.suffix} ?"
        - "Quantité {sens.adj} par la région {region} en {annee}{unite.suffix} ?"
        - "Donne-moi l'énergie {sens.adj} par la région {region} en {annee}{unite.suffix}."
        - "Quel volume d'énergie la région {region} a-t-elle {sens.m} en {annee}{unite.suffix} ?"
      it:
        - "Quanta energia ha {sens} la regione {region} nel {annee}{unite.suffix}?"
        - "Energia {sens.adj} dalla regione {region} nel {annee}{unite.suffix}?"
        - "Quanta elettricità ha {sens} la regione {region} nel {annee}{unite.suffix}?"
        - "Quantità {sens.adj} dalla regione {region} nel {annee}{unite.suffix}?"
        - "Dammi l'energia {sens.adj} dalla regione {region} nel {annee}{unite.suffix}."
        - "Che volume di energia ha {sens} la regione {region} nel {annee}{unite.suffix}?"

    sql: |
      SELECT {sens.sign}SUM(ech_physiques_mw) {unite.expr} AS energie_{unite.id}
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee} AND ech_physiques_mw {sens.op} 0

    result:
      columns: [energie]
      order_matters: false

  - template_id: agg_pumping_energy_region_year
    family: aggregation
    conventions: [pumping_sign, energy_conversion, unit_scaling]
    description: >
      Energy consumed by pumped-storage plants (STEP) in a region over a year. The column is
      negative, so the energy is -SUM(pompage_mw) * 0.5; a region without STEP drops out.

    slots:
      region:
        from: regions
      annee:
        range: [2013, 2025]
      unite:
        from: energy_units

    max_instances: 35

    questions:
      fr:
        - "Quelle quantité d'énergie les stations de pompage ont-elles consommée {region.in} en {annee}{unite.suffix} ?"
        - "Consommation des STEP {region.in} en {annee}{unite.suffix} ?"
        - "Combien d'énergie le pompage a-t-il absorbé {region.in} en {annee}{unite.suffix} ?"
        - "Pompage {region.in} en {annee}{unite.suffix} ?"
        - "Donne-moi la consommation des STEP {region.in} en {annee}{unite.suffix}."
        - "Quel volume d'énergie a été consommé par le pompage {region.in} en {annee}{unite.suffix} ?"
      it:
        - "Quanta energia hanno consumato le stazioni di pompaggio {region.in} nel {annee}{unite.suffix}?"
        - "Consumo degli impianti di pompaggio {region.in} nel {annee}{unite.suffix}?"
        - "Quanta energia ha assorbito il pompaggio {region.in} nel {annee}{unite.suffix}?"
        - "Pompaggio {region.in} nel {annee}{unite.suffix}?"
        - "Dammi il consumo degli impianti di pompaggio {region.in} nel {annee}{unite.suffix}."
        - "Che volume di energia è stato consumato dal pompaggio {region.in} nel {annee}{unite.suffix}?"

    require: |
      SELECT count(DISTINCT pompage_mw) > 1
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}

    sql: |
      SELECT -SUM(pompage_mw) {unite.expr} AS energie_{unite.id}
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}

    result:
      columns: [energie]
      order_matters: false

  - template_id: agg_energy_measure_region_relative_period
    family: aggregation
    conventions: [relative_dates, energy_conversion, unit_scaling]
    description: >
      Energy produced by one source in one region "last month" or "last year", both counted
      from the last date of the data (glossary §2: last month = June 2026, last year = 2025),
      computed from `max(date)` so that the query stays right when the data grows. Train only:
      no other train template resolved a relative date, which test asks for.
    train_only: true

    slots:
      mesure:
        from: measures
        keep: {kind: production}
      region:
        from: regions
      periode:
        values:
          - id: last_month
            label: {fr: le mois dernier, it: il mese scorso}
            sql: annee = year(d) AND mois = month(d)
          - id: last_year
            label: {fr: l'an dernier, it: l'anno scorso}
            sql: annee = year(d) - 1
      unite:
        from: energy_units

    max_instances: 35

    questions:
      fr:
        - "Combien d'énergie {mesure} est sortie des installations {region.in} {periode}{unite.suffix} ?"
        - "Production {mesure} {region.in} {periode}{unite.suffix} ?"
        - "{mesure.nom} {region.in} {periode}{unite.suffix} ?"
        - "Quelle production pour {mesure.le} {region.in} {periode}{unite.suffix} ?"
        - "J'aimerais connaître l'énergie {mesure} produite {region.in} {periode}{unite.suffix}."
        - "{periode} : combien d'énergie {mesure} a-t-on produite {region.in}{unite.suffix} ?"
      it:
        - "Quanta energia {mesure} è uscita dagli impianti {region.in} {periode}{unite.suffix}?"
        - "Produzione {mesure} {region.in} {periode}{unite.suffix}?"
        - "{mesure.nom} {region.in} {periode}{unite.suffix}?"
        - "Che produzione per {mesure.le} {region.in} {periode}{unite.suffix}?"
        - "Vorrei conoscere l'energia {mesure} prodotta {region.in} {periode}{unite.suffix}."
        - "{periode}, che quantità di energia {mesure} hanno generato gli impianti {region.in}{unite.suffix}?"

    sql: |
      WITH fin AS (SELECT max(date) AS d FROM eco2mix)
      SELECT SUM({mesure.sql}) {unite.expr} AS energie_{unite.id}
      FROM eco2mix, fin
      WHERE region = {region.literal} AND {periode.sql}

    result:
      columns: [energie]
      order_matters: false
