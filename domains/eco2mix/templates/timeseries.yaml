# Family "timeseries": one row per time bucket, in chronological order.

templates:
  - template_id: ts_monthly_energy_region_year
    family: timeseries
    conventions: [energy_conversion, unit_scaling, result_shape]
    description: >
      Month-by-month energy of one measure in one region over a year. Exercises grouping by
      the convenience column `mois`, the chronological order, and the energy conversion.

    slots:
      mesure:
        from: measures
        keep: {kind: [production, demand]}
      region:
        from: regions
      annee:
        range: [2013, 2025]
      unite:
        from: energy_units

    max_instances: 60

    questions:
      fr:
        - "Quelle a été l'évolution mois par mois de l'énergie {mesure} {region.in} en {annee}{unite.suffix} ?"
        - "Énergie {mesure} par mois {region.in} en {annee}{unite.suffix} ?"
      it:
        - "Qual è stato l'andamento mese per mese dell'energia {mesure} {region.in} nel {annee}{unite.suffix}?"
        - "Energia {mesure} mese per mese {region.in} nel {annee}{unite.suffix}?"

    # A source the region does not have gives twelve empty months, which the month numbers
    # would hide from the degenerate-answer filter. Require the measure to vary.
    require: |
      SELECT count(DISTINCT {mesure.sql}) > 1
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}

    sql: |
      SELECT mois, SUM({mesure.sql}) {unite.expr} AS energie_{unite.id}
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}
      GROUP BY mois
      ORDER BY mois

    result:
      columns: [mois, energie]
      order_matters: true

  - template_id: ts_hourly_profile_consumption_region_month
    family: timeseries
    conventions: [hour_of_day, average_power, weekday_weekend, result_shape]
    description: >
      Average consumption for each hour of the day, on weekdays or at the weekend, over one
      month: 24 rows. Each hour averages its two half-hours, as "at 19h" does (glossary §2).

    slots:
      jours:
        values:
          - {id: semaine, where: "isodow(date) BETWEEN 1 AND 5", in: {fr: en semaine, it: nei giorni feriali}}
          - {id: weekend, where: "isodow(date) IN (6, 7)", in: {fr: le week-end, it: nel fine settimana}}
      region:
        from: regions
      mois:
        from: months
      annee:
        range: [2013, 2025]

    max_instances: 20

    questions:
      fr:
        - "Quel a été le profil horaire moyen de la consommation {region.in} {jours.in} {mois.in} {annee}, en MW ?"
        - "Consommation moyenne heure par heure {region.in} {jours.in}, {mois.in} {annee}, en MW ?"
        - "Donne la consommation moyenne de chaque heure de la journée {region.in} {jours.in} {mois.in} {annee}, en MW."
        - "Quel a été le profil horaire moyen de la consommation {region.in} {jours.in} {mois.in} {annee} ?"  # no unit: MW by default
      it:
        - "Qual è stato il profilo orario medio del consumo {region.in} {jours.in} {mois.in} {annee}, in MW?"
        - "Consumo medio ora per ora {region.in} {jours.in}, {mois.in} {annee}, in MW?"
        - "Indica il consumo medio di ogni ora del giorno {region.in} {jours.in} {mois.in} {annee}, in MW."
        - "Qual è stato il profilo orario medio del consumo {region.in} {jours.in} {mois.in} {annee}?"  # no unit: MW by default

    sql: |
      SELECT heure, AVG(consommation_mw) AS conso_moyenne_mw
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee} AND mois = {mois.id}
        AND {jours.where}
      GROUP BY heure
      ORDER BY heure

    result:
      columns: [heure, conso_moyenne_mw]
      order_matters: true

  - template_id: ts_yearly_trend_measure_region
    family: timeseries
    conventions: [year_range_inclusive, energy_conversion, unit_scaling]
    description: >
      Year-by-year production of one source in a region over a range of years, both ends
      included. Grouping by `annee` with a BETWEEN on the years.

    slots:
      mesure:
        from: measures
        keep: {kind: production}
      region:
        from: regions
      annee_a:
        range: [2013, 2022]
      annee_b:
        range: [2016, 2025]
      unite:
        from: energy_units

    constraints:
      - "annee_b > annee_a"

    max_instances: 20

    questions:
      fr:
        - "Comment a évolué la production {mesure} {region.in} d'année en année entre {annee_a} et {annee_b}{unite.suffix} ?"
        - "Production {mesure} annuelle {region.in} de {annee_a} à {annee_b}{unite.suffix} ?"
        - "Donne la production {mesure} de chaque année {region.in} entre {annee_a} et {annee_b}{unite.suffix}."
      it:
        - "Com'è cambiata anno per anno la produzione {mesure} {region.in} fra il {annee_a} e il {annee_b}{unite.suffix}?"
        - "Produzione {mesure} annua {region.in} dal {annee_a} al {annee_b}{unite.suffix}?"
        - "Indica la produzione {mesure} di ogni anno {region.in} fra il {annee_a} e il {annee_b}{unite.suffix}."

    require: |
      SELECT count(DISTINCT {mesure.sql}) > 1
      FROM eco2mix
      WHERE region = {region.literal} AND annee BETWEEN {annee_a} AND {annee_b}

    sql: |
      SELECT annee, SUM({mesure.sql}) {unite.expr} AS energie_{unite.id}
      FROM eco2mix
      WHERE region = {region.literal} AND annee BETWEEN {annee_a} AND {annee_b}
      GROUP BY annee
      ORDER BY annee

    result:
      columns: [annee, energie]
      order_matters: true

  - template_id: ts_daily_consumption_national_month
    family: timeseries
    conventions: [national_aggregate, daily_total, energy_conversion, unit_scaling]
    description: >
      National consumption day by day over one month: the twelve regions summed per date, one
      row per day in order.

    slots:
      mois:
        from: months
      annee:
        range: [2013, 2025]
      unite:
        from: energy_units

    max_instances: 20

    questions:
      fr:
        - "Quelle a été la consommation nationale jour par jour {mois.in} {annee}{unite.suffix} ?"
        - "Consommation électrique quotidienne de la France {mois.in} {annee}{unite.suffix} ?"
        - "Donne la consommation de la France pour chaque jour {mois.in} {annee}{unite.suffix}."
      it:
        - "Qual è stato il consumo nazionale giorno per giorno {mois.in} {annee}{unite.suffix}?"
        - "Consumo elettrico giornaliero della Francia {mois.in} {annee}{unite.suffix}?"
        - "Indica il consumo della Francia per ogni giorno {mois.in} {annee}{unite.suffix}."

    sql: |
      SELECT date, SUM(consommation_mw) {unite.expr} AS energie_{unite.id}
      FROM eco2mix
      WHERE annee = {annee} AND mois = {mois.id}
      GROUP BY date
      ORDER BY date

    result:
      columns: [date, energie]
      order_matters: true

  - template_id: ts_cumulative_production_region_year
    family: timeseries
    conventions: [cumulative_total, energy_conversion, unit_scaling]
    description: >
      Production of one source in a region, cumulated month after month from January. A
      window function over an aggregate: SUM of the monthly SUM, ordered by month.

    slots:
      mesure:
        from: measures
        keep: {kind: production}
      region:
        from: regions
      annee:
        range: [2013, 2025]
      unite:
        from: energy_units

    max_instances: 20

    questions:
      fr:
        - "Quelle a été la production {mesure} cumulée mois après mois {region.in} en {annee}{unite.suffix} ?"
        - "Production {mesure} cumulée depuis le début de l'année, mois par mois, {region.in} en {annee}{unite.suffix} ?"
        - "Donne pour chaque mois de {annee} la production {mesure} cumulée depuis janvier {region.in}{unite.suffix}."
      it:
        - "Qual è stata la produzione {mesure} cumulata mese dopo mese {region.in} nel {annee}{unite.suffix}?"
        - "Produzione {mesure} cumulata da inizio anno, mese per mese, {region.in} nel {annee}{unite.suffix}?"
        - "Indica per ogni mese del {annee} la produzione {mesure} cumulata da gennaio {region.in}{unite.suffix}."

    require: |
      SELECT count(DISTINCT {mesure.sql}) > 1
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}

    sql: |
      SELECT mois, SUM(SUM({mesure.sql}) {unite.expr}) OVER (ORDER BY mois) AS energie_cumulee_{unite.id}
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}
      GROUP BY mois
      ORDER BY mois

    result:
      columns: [mois, energie_cumulee]
      order_matters: true
