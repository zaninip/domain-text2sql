# Family "classification": label each row according to an aggregate.

templates:
  - template_id: cls_exchange_role_season
    family: classification
    conventions: [exchange_sign, season, result_shape]
    description: >
      Which regions were net exporters and which net importers over one season. Exercises the
      sign of ech_physiques (negative = exporter), the fixed season boundaries, and the rule
      that a classification returns the value the label is based on.

    slots:
      saison:
        from: seasons
      annee:
        range: [2014, 2025]   # 2013 excluded: winter starts in the previous year

    # Answer strings must be in the language of the question, or the comparison with the
    # gold result would fail on the label alone.
    constants:
      exportatrice: {fr: exportatrice, it: esportatrice}
      importatrice: {fr: importatrice, it: importatrice}

    max_instances: 35

    # Words that keep the variants on this template's meaning: net balance, not the gross exports of agg_exchange_gross_region_year.
    must_say:
      fr: ["net*", "solde", "plus qu'elles"]
      it: ["nett*", "saldo", "più di quanto"]

    questions:
      fr:
        - "Quelles régions ont été exportatrices nettes et lesquelles importatrices nettes {saison.in} {annee} ?"
        - "Solde des échanges de chaque région {saison.in} {annee} : exportatrice ou importatrice ?"
        - "{saison.in} {annee}, quelles régions ont exporté plus qu'elles n'ont importé, et lesquelles l'inverse ?"
        - "Donne-moi les régions exportatrices nettes et importatrices nettes {saison.in} {annee}."
        - "Régions exportatrices ou importatrices nettes {saison.in} {annee} ?"
      it:
        - "Quali regioni sono state esportatrici nette e quali importatrici nette {saison.in} {annee}?"
        - "Saldo degli scambi di ogni regione {saison.in} {annee}: esportatrice o importatrice?"
        - "{saison.in} {annee}, quali regioni hanno esportato più di quanto abbiano importato, e quali il contrario?"
        - "Dammi le regioni esportatrici nette e importatrici nette {saison.in} {annee}."
        - "Regioni esportatrici o importatrici nette {saison.in} {annee}?"

    sql: |
      SELECT region,
             SUM(ech_physiques_mw) * 0.5 / 1000 AS solde_gwh,
             CASE WHEN SUM(ech_physiques_mw) < 0 THEN '{exportatrice}' ELSE '{importatrice}' END AS role
      FROM eco2mix
      WHERE date BETWEEN '{saison.start}' AND '{saison.end}'
      GROUP BY region
      ORDER BY solde_gwh

    result:
      columns: [region, solde_gwh, role]
      order_matters: false

  - template_id: cls_main_source_per_region_year
    family: classification
    conventions: [source_names, ranking_tie_break, energy_conversion]
    description: >
      The main production source of every region over a year: one row per region with its
      top source (named by column) and that source's energy. UNPIVOT the six sources, sum per
      region and source, keep the first per region with QUALIFY; ties go to the source name.

    slots:
      annee:
        range: [2013, 2025]

    max_instances: 35

    questions:
      fr:
        - "Quelle a été la principale source de production de chaque région en {annee} ?"
        - "Pour chaque région, quelle filière a le plus produit en {annee} ?"
        - "Source de production dominante par région en {annee} ?"
        - "Donne-moi la filière qui a produit le plus d'énergie dans chaque région en {annee}."
        - "En {annee}, quelle a été la première filière de production région par région ?"
        - "Première source de production par région, {annee} ?"
      it:
        - "Qual è stata la principale fonte di produzione di ciascuna regione nel {annee}?"
        - "Per ogni regione, quale fonte ha prodotto di più nel {annee}?"
        - "Fonte di produzione dominante per regione nel {annee}?"
        - "Dammi la fonte che ha prodotto più energia in ciascuna regione nel {annee}."
        - "Nel {annee}, qual è stata la prima fonte di produzione regione per regione?"
        - "Prima fonte di produzione per regione, {annee}?"

    sql: |
      WITH s AS (
        SELECT region, source, SUM(mw) * 0.5 AS energie_mwh
        FROM (
          UNPIVOT (
            SELECT region, thermique_mw, nucleaire_mw, eolien_mw, solaire_mw, hydraulique_mw, bioenergies_mw
            FROM eco2mix
            WHERE annee = {annee}
          ) ON COLUMNS(* EXCLUDE (region)) INTO NAME source VALUE mw
        )
        GROUP BY region, source
      )
      SELECT region, source, energie_mwh
      FROM s
      QUALIFY row_number() OVER (PARTITION BY region ORDER BY energie_mwh DESC, source) = 1

    result:
      columns: [region, source, energie_mwh]
      order_matters: false

  - template_id: cls_region_vs_average_consumption_year
    family: classification
    conventions: [average_of_regions, labels_from_question, energy_conversion]
    description: >
      Every region labelled above or below the average of the twelve regional consumptions of a
      year. The average is taken over one row per region (a window AVG), and the labels are
      the words the question itself uses, in its language (glossary §8).

    slots:
      annee:
        range: [2013, 2025]

    constants:
      dessus: {fr: au-dessus, it: sopra}
      dessous: {fr: en dessous, it: sotto}

    max_instances: 35

    questions:
      fr:
        - "Quelles régions ont consommé au-dessus de la moyenne régionale en {annee}, et lesquelles en dessous ?"
        - "Consommation de chaque région en {annee} : au-dessus ou en dessous de la moyenne des régions ?"
        - "En {annee}, classe chaque région au-dessus ou en dessous de la consommation régionale moyenne."
        - "Donne-moi les régions dont la consommation a dépassé la moyenne régionale en {annee}, et celles qui sont restées en dessous."
        - "En {annee}, quelles régions se situent au-dessus de la moyenne de consommation des régions, et quelles régions en dessous ?"
        - "Région par région en {annee} : consommation au-dessus ou en dessous de la moyenne régionale ?"
      it:
        - "Quali regioni hanno consumato sopra la media regionale nel {annee}, e quali sotto?"
        - "Consumo di ciascuna regione nel {annee}: sopra o sotto la media delle regioni?"
        - "Nel {annee}, indica per ogni regione se il consumo è stato sopra o sotto la media regionale."
        - "Dammi le regioni il cui consumo ha superato la media regionale nel {annee}, e quelle rimaste sotto."
        - "Nel {annee}, quali regioni si collocano sopra la media di consumo delle regioni, e quali sotto?"
        - "Regione per regione nel {annee}: consumo sopra o sotto la media regionale?"

    sql: |
      WITH r AS (
        SELECT region, SUM(consommation_mw) * 0.5 AS energie_mwh
        FROM eco2mix
        WHERE annee = {annee}
        GROUP BY region
      )
      SELECT region, energie_mwh,
             CASE WHEN energie_mwh > AVG(energie_mwh) OVER () THEN '{dessus}' ELSE '{dessous}' END
               AS position
      FROM r

    result:
      columns: [region, energie_mwh, position]
      order_matters: false

  - template_id: cls_region_vs_average_production_source_year
    family: classification
    conventions: [average_of_regions, labels_from_question, energy_conversion]
    description: >
      Every region labelled above or below the average of the twelve regional productions of
      one source over a year: a window AVG over one row per region, only for years where every
      region has a value, labels in the words of the question (glossary §8). Train only: coverage
      rule, decisions.md 2026-10-08.
    train_only: true

    slots:
      mesure:
        from: measures
        keep: {kind: production}
      annee:
        range: [2013, 2025]

    constants:
      dessus: {fr: au-dessus, it: sopra}
      dessous: {fr: en dessous, it: sotto}

    max_instances: 35

    # The labels are the question's own words, so every variant names them; and production, not
    # the consumption of cls_region_vs_average_consumption_year.
    must_say:
      fr: ["au-dessus"]
      it: ["sopra"]
    must_not_say:
      fr: ["consomm*"]
      it: ["consum*"]

    questions:
      fr:
        - "Pour {mesure.le} en {annee}, range les régions en deux groupes : au-dessus et en dessous de la moyenne régionale de production."
        - "Quelles régions dépassaient la moyenne régionale de production {mesure} en {annee} (au-dessus) et lesquelles non (en dessous) ?"
        - "Chaque région a-t-elle produit plus ou moins d'énergie {mesure} que la moyenne régionale en {annee} ? Réponds au-dessus ou en dessous."
        - "Comparées à leur moyenne, les régions ont-elles produit au-dessus ou en dessous pour {mesure.le} en {annee} ? Une étiquette par région."
        - "Étiquette chaque région, au-dessus ou en dessous, selon sa production {mesure} de {annee} par rapport à la moyenne des régions."
        - "{annee}, énergie {mesure} : marque chaque région au-dessus ou en dessous de la moyenne des douze régions."
      it:
        - "Per {mesure.le} nel {annee}, dividi le regioni in due gruppi: sopra e sotto la media regionale di produzione."
        - "Quali regioni superavano la media regionale di produzione {mesure} nel {annee} (sopra) e quali no (sotto)?"
        - "Energia {mesure} prodotta nel {annee}: per ogni regione, sopra o sotto la media regionale?"
        - "Rispetto alla loro media, le regioni hanno prodotto sopra o sotto per {mesure.le} nel {annee}? Un'etichetta per regione."
        - "Etichetta ogni regione, sopra o sotto, in base alla produzione {mesure} del {annee} rispetto alla media delle regioni."
        - "{annee}, energia {mesure}: segna ogni regione come sopra o sotto la media delle dodici regioni."

    # A region with no value (NULL: "not available", glossary §7) would be labelled by how SQL
    # treats NULL in a CASE, not by the data: keep the years where every region has a value.
    require: |
      SELECT bool_and(s IS NOT NULL)
      FROM (SELECT SUM({mesure.sql}) AS s FROM eco2mix WHERE annee = {annee} GROUP BY region)

    sql: |
      WITH r AS (
        SELECT region, SUM({mesure.sql}) * 0.5 AS energie_mwh
        FROM eco2mix
        WHERE annee = {annee}
        GROUP BY region
      )
      SELECT region, energie_mwh,
             CASE WHEN energie_mwh > AVG(energie_mwh) OVER () THEN '{dessus}' ELSE '{dessous}' END
               AS position
      FROM r

    result:
      columns: [region, energie_mwh, position]
      order_matters: false
