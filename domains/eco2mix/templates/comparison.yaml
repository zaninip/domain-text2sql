# Family "comparison": two aggregates compared inside a single query.

templates:
  - template_id: cmp_yearly_change_pct_region
    family: comparison
    conventions: [percentage_change, result_shape]
    description: >
      Relative change of one measure in a region between two years. Two aggregates must live
      in one query (FILTER or CTE), and the percentage is (later - earlier) / earlier; the
      energy factor cancels out in the ratio, so it is deliberately absent.

    slots:
      mesure:
        from: measures
        keep: {kind: [production, demand]}
      region:
        from: regions
      annee_a:
        range: [2013, 2023]
      annee_b:
        range: [2015, 2025]

    constraints:
      - "annee_b > annee_a"

    max_instances: 35

    # CLOSE NEIGHBOUR: cmp_last_month_vs_year_before_region computes the same percentage change
    # of the same measure in the same region; only the period differs. Here the two years are
    # slots, so the slot test already forces every variant to name both of them.
    # Words that keep the variants on this template's meaning: no "last month", and no production
    # words, because {mesure} can be consumption ("la production consommée").
    must_not_say:
      fr: ["mois dernier", "production", "produi*"]
      it: ["mese scorso", "produzione", "prodott*"]

    questions:
      fr:
        - "Comment l'énergie {mesure} a-t-elle évolué {region.in} entre {annee_a} et {annee_b}, en pourcentage ?"
        - "Variation en pourcentage de l'énergie {mesure} {region.in} de {annee_a} à {annee_b} ?"
        - "Donne-moi l'évolution en pourcentage de l'énergie {mesure} {region.in} entre {annee_a} et {annee_b}."
        - "Évolution {mesure.de} {region.in}, {annee_a} contre {annee_b}, en pourcentage ?"
        - "{region.in}, de combien l'énergie {mesure} a-t-elle progressé ou reculé entre {annee_a} et {annee_b}, en pourcentage ?"
      it:
        - "Di quanto è cambiata in percentuale l'energia {mesure} {region.in} fra il {annee_a} e il {annee_b}?"
        - "Variazione percentuale dell'energia {mesure} {region.in} dal {annee_a} al {annee_b}?"
        - "Dammi l'evoluzione in percentuale dell'energia {mesure} {region.in} fra il {annee_a} e il {annee_b}."
        - "Evoluzione {mesure.de} {region.in}, {annee_a} contro {annee_b}, in percentuale?"
        - "{region.in}, di quanto è cresciuta o calata l'energia {mesure} fra il {annee_a} e il {annee_b}, in percentuale?"

    sql: |
      SELECT 100.0 * (SUM({mesure.sql}) FILTER (WHERE annee = {annee_b})
                    - SUM({mesure.sql}) FILTER (WHERE annee = {annee_a}))
                    / SUM({mesure.sql}) FILTER (WHERE annee = {annee_a}) AS variation_pct
      FROM eco2mix
      WHERE region = {region.literal} AND annee IN ({annee_a}, {annee_b})

    result:
      columns: [variation_pct]
      order_matters: false

  - template_id: cmp_two_regions_measure_year
    family: comparison
    conventions: [energy_conversion, unit_scaling, result_shape]
    description: >
      One source in two regions over the same year, both values side by side. The answer is
      the two rows, from which the larger one reads directly; no label is computed.

    slots:
      mesure:
        from: measures
        keep: {kind: production}
      region_a:
        from: regions
      region_b:
        from: regions
      annee:
        range: [2013, 2025]
      unite:
        from: energy_units

    constraints:
      - "region_a != region_b"

    max_instances: 35

    questions:
      fr:
        - "Quelle région a produit le plus d'énergie {mesure} en {annee}, entre la région {region_a} et la région {region_b}{unite.suffix} ?"
        - "Compare la production {mesure} de la région {region_a} et de la région {region_b} en {annee}{unite.suffix}."
        - "Production {mesure} en {annee} : région {region_a} contre région {region_b}{unite.suffix} ?"
        - "Donne-moi la production {mesure} de la région {region_a} et de la région {region_b} en {annee}{unite.suffix}."
        - "{mesure.le} en {annee} : qui produit le plus, la région {region_a} ou la région {region_b}{unite.suffix} ?"
        - "Entre la région {region_a} et la région {region_b}, laquelle a la plus forte production {mesure} en {annee}{unite.suffix} ?"
      it:
        - "Quale regione ha prodotto più energia {mesure} nel {annee}, fra la regione {region_a} e la regione {region_b}{unite.suffix}?"
        - "Confronta la produzione {mesure} della regione {region_a} e della regione {region_b} nel {annee}{unite.suffix}."
        - "Produzione {mesure} nel {annee}: regione {region_a} contro regione {region_b}{unite.suffix}?"
        - "Dammi la produzione {mesure} della regione {region_a} e della regione {region_b} nel {annee}{unite.suffix}."
        - "{mesure.le} nel {annee}: chi produce di più, la regione {region_a} o la regione {region_b}{unite.suffix}?"
        - "Fra la regione {region_a} e la regione {region_b}, quale ha la produzione {mesure} più alta nel {annee}{unite.suffix}?"

    # Both regions must have the source, or one side of the comparison is an empty 0.
    require: |
      SELECT count(DISTINCT {mesure.sql}) FILTER (WHERE region = {region_a.literal}) > 1
         AND count(DISTINCT {mesure.sql}) FILTER (WHERE region = {region_b.literal}) > 1
      FROM eco2mix
      WHERE annee = {annee}

    sql: |
      SELECT region, SUM({mesure.sql}) {unite.expr} AS energie_{unite.id}
      FROM eco2mix
      WHERE annee = {annee} AND region IN ({region_a.literal}, {region_b.literal})
      GROUP BY region

    result:
      columns: [region, energie]
      order_matters: false

  - template_id: cmp_same_month_two_years_region
    family: comparison
    conventions: [energy_conversion]
    description: >
      One source in one region, the same calendar month of two different years. The unit is
      fixed to GWh, the natural scale of a regional month, to keep the slot product bounded.

    slots:
      mesure:
        from: measures
        keep: {kind: production}
      region:
        from: regions
      mois:
        from: months
      annee_a:
        range: [2013, 2024]
      annee_b:
        range: [2014, 2025]

    constraints:
      - "annee_b > annee_a"

    max_instances: 35

    questions:
      fr:
        - "Compare la production {mesure} {region.in} {mois.in} {annee_a} et {mois.in} {annee_b}, en GWh."
        - "Quelle a été la production {mesure} {region.in} {mois.in} {annee_a} et {mois.in} {annee_b}, en GWh ?"
        - "Production {mesure} {region.in} : {mois} {annee_a} contre {mois} {annee_b}, en GWh ?"
        - "Donne-moi la production {mesure} {region.in} {mois.in} {annee_a} et {mois.in} {annee_b}, en GWh."
        - "{mois} {annee_a} contre {mois} {annee_b} : quelle production {mesure} {region.in}, en GWh ?"
        - "Comment la production {mesure} {region.in} {mois.de} se compare-t-elle entre {annee_a} et {annee_b}, en GWh ?"
      it:
        - "Confronta la produzione {mesure} {region.in} {mois.in} {annee_a} e {mois.in} {annee_b}, in GWh."
        - "Qual è stata la produzione {mesure} {region.in} {mois.in} {annee_a} e {mois.in} {annee_b}, in GWh?"
        - "Produzione {mesure} {region.in}: {mois} {annee_a} contro {mois} {annee_b}, in GWh?"
        - "Dammi la produzione {mesure} {region.in} {mois.in} {annee_a} e {mois.in} {annee_b}, in GWh."
        - "{mois} {annee_a} contro {mois} {annee_b}: che produzione {mesure} {region.in}, in GWh?"
        - "Come si confronta la produzione {mesure} {region.in} di {mois} fra il {annee_a} e il {annee_b}, in GWh?"

    require: |
      SELECT count(DISTINCT {mesure.sql}) FILTER (WHERE annee = {annee_a}) > 1
         AND count(DISTINCT {mesure.sql}) FILTER (WHERE annee = {annee_b}) > 1
      FROM eco2mix
      WHERE region = {region.literal} AND mois = {mois.id}

    sql: |
      SELECT annee, SUM({mesure.sql}) * 0.5 / 1000 AS energie_gwh
      FROM eco2mix
      WHERE region = {region.literal} AND mois = {mois.id} AND annee IN ({annee_a}, {annee_b})
      GROUP BY annee

    result:
      columns: [annee, energie_gwh]
      order_matters: false

  - template_id: cmp_winter_summer_consumption_ratio_region
    family: comparison
    conventions: [season, ratio_of_sums]
    description: >
      How many times a region's consumption in winter exceeds its consumption in summer, for
      the winter and the summer of the same named year. Winter N starts on 21 December N-1
      (glossary §2); the energy factor cancels out in the ratio.

    slots:
      region:
        from: regions
      annee:
        range: [2014, 2025]

    max_instances: 35

    questions:
      fr:
        - "Quel est le rapport entre la consommation de l'hiver {annee} et celle de l'été {annee} {region.in} ?"
        - "Rapport entre la consommation hivernale et la consommation estivale de {annee} {region.in} ?"
        - "Combien de fois la consommation de l'hiver {annee} a-t-elle dépassé celle de l'été {annee} {region.in} ?"
        - "Donne-moi le rapport entre la consommation hivernale et la consommation estivale de {annee} {region.in}."
        - "Hiver {annee} contre été {annee} {region.in} : quel rapport de consommation ?"
        - "La consommation de l'hiver {annee} représente combien de fois celle de l'été {annee} {region.in} ?"
      it:
        - "Qual è il rapporto fra il consumo dell'inverno {annee} e quello dell'estate {annee} {region.in}?"
        - "Rapporto fra consumo invernale ed estivo del {annee} {region.in}?"
        - "Quante volte il consumo dell'inverno {annee} è stato più alto di quello dell'estate {annee} {region.in}?"
        - "Dammi il rapporto fra il consumo invernale e quello estivo del {annee} {region.in}."
        - "Inverno {annee} contro estate {annee} {region.in}: che rapporto di consumo?"
        - "Il consumo dell'inverno {annee} vale quante volte quello dell'estate {annee} {region.in}?"

    sql: |
      SELECT SUM(consommation_mw) FILTER (WHERE date BETWEEN '{annee-1}-12-21' AND '{annee}-03-19')
           / SUM(consommation_mw) FILTER (WHERE date BETWEEN '{annee}-06-21' AND '{annee}-09-21')
             AS rapport
      FROM eco2mix
      WHERE region = {region.literal}

    result:
      columns: [rapport]
      order_matters: false

  - template_id: cmp_last_month_vs_year_before_region
    family: comparison
    conventions: [relative_dates, percentage_change]
    description: >
      Change of one source in one region between "last month" and the same month a year
      earlier. "Last month" is the last month of the data, not of today's calendar
      (glossary §2); the gold computes it from max(date) so it survives a data refresh.

    slots:
      mesure:
        from: measures
        keep: {kind: production}
      region:
        from: regions

    max_instances: 35

    # CLOSE NEIGHBOUR: cmp_yearly_change_pct_region computes the same percentage change with two
    # explicit years. This template has no slot for the period, so the period word is enforced
    # by `must_say` below: a variant without "le mois dernier" / "il mese scorso" would be a
    # question with no period at all.
    # Words that keep the variants on this template's meaning: the period word of this template.
    must_say:
      fr: ["mois dernier"]
      it: ["mese scorso"]

    questions:
      fr:
        - "De combien a varié, en pourcentage, la production {mesure} {region.in} le mois dernier par rapport au même mois de l'année précédente ?"
        - "Variation en pourcentage de la production {mesure} {region.in} entre le mois dernier et le même mois un an plus tôt ?"
        - "Le mois dernier, la production {mesure} {region.in} a-t-elle augmenté ou baissé par rapport au même mois de l'an dernier, et de combien en pourcentage ?"
        - "Donne-moi la variation en pourcentage de la production {mesure} {region.in} entre le mois dernier et le même mois de l'année précédente."
        - "Production {mesure} {region.in} : le mois dernier contre le même mois un an plus tôt, en pourcentage ?"
        - "Sur un an, de combien la production {mesure} {region.in} du mois dernier a-t-elle évolué, en pourcentage ?"
      it:
        - "Di quanto è variata in percentuale la produzione {mesure} {region.in} il mese scorso rispetto allo stesso mese dell'anno precedente?"
        - "Variazione percentuale della produzione {mesure} {region.in} fra il mese scorso e lo stesso mese di un anno prima?"
        - "Il mese scorso la produzione {mesure} {region.in} è aumentata o diminuita rispetto allo stesso mese dell'anno scorso, e di quanto in percentuale?"
        - "Dammi la variazione in percentuale della produzione {mesure} {region.in} fra il mese scorso e lo stesso mese dell'anno precedente."
        - "Produzione {mesure} {region.in}: il mese scorso contro lo stesso mese di un anno prima, in percentuale?"
        - "Su base annua, di quanto è variata la produzione {mesure} {region.in} del mese scorso, in percentuale?"

    require: |
      SELECT count(DISTINCT {mesure.sql}) > 1
      FROM eco2mix
      WHERE region = {region.literal} AND date >= (SELECT max(date) FROM eco2mix) - INTERVAL 13 MONTH

    sql: |
      WITH fin AS (SELECT max(date) AS d FROM eco2mix)
      SELECT 100.0 * (SUM({mesure.sql}) FILTER (WHERE annee = year(d) AND mois = month(d))
                    - SUM({mesure.sql}) FILTER (WHERE annee = year(d) - 1 AND mois = month(d)))
                    / SUM({mesure.sql}) FILTER (WHERE annee = year(d) - 1 AND mois = month(d))
             AS variation_pct
      FROM eco2mix, fin
      WHERE region = {region.literal}

    result:
      columns: [variation_pct]
      order_matters: false

  - template_id: cmp_change_pct_national_two_years
    family: comparison
    conventions: [percentage_change, national_aggregate, result_shape]
    description: >
      Relative change of one measure over France between two years: the national version of
      cmp_yearly_change_pct_region, (later - earlier) / earlier over the twelve regions. Train
      only: coverage rule, decisions.md 2026-10-08.
    train_only: true

    slots:
      mesure:
        from: measures
        keep: {kind: [production, demand]}
      annee_a:
        range: [2013, 2023]
      annee_b:
        range: [2015, 2025]

    constraints:
      - "annee_b > annee_a"

    max_instances: 35

    # France as a whole, not a region; no "last month", and no production words because
    # {mesure} can be consumption.
    must_say:
      fr: ["France", "national*"]
      it: ["Francia", "nazional*"]
    must_not_say:
      fr: ["mois dernier", "production", "produi*"]
      it: ["mese scorso", "produzione", "prodott*"]

    questions:
      fr:
        - "Comment l'énergie {mesure} a-t-elle évolué en France entre {annee_a} et {annee_b}, en pourcentage ?"
        - "Variation en pourcentage de l'énergie {mesure} au niveau national de {annee_a} à {annee_b} ?"
        - "Donne-moi l'évolution en pourcentage de l'énergie {mesure} en France entre {annee_a} et {annee_b}."
        - "France : de combien l'énergie {mesure} a-t-elle progressé ou reculé entre {annee_a} et {annee_b}, en pourcentage ?"
        - "Évolution nationale {mesure.de}, {annee_a} contre {annee_b}, en pourcentage ?"
        - "Entre {annee_a} et {annee_b}, quelle variation en pourcentage pour l'énergie {mesure} en France ?"
      it:
        - "Di quanto è cambiata in percentuale l'energia {mesure} in Francia fra il {annee_a} e il {annee_b}?"
        - "Variazione percentuale dell'energia {mesure} a livello nazionale dal {annee_a} al {annee_b}?"
        - "Dammi l'evoluzione in percentuale dell'energia {mesure} in Francia fra il {annee_a} e il {annee_b}."
        - "Francia: di quanto è cresciuta o calata l'energia {mesure} fra il {annee_a} e il {annee_b}, in percentuale?"
        - "Evoluzione nazionale {mesure.de}, {annee_a} contro {annee_b}, in percentuale?"
        - "Fra il {annee_a} e il {annee_b}, che variazione percentuale per l'energia {mesure} in Francia?"

    sql: |
      SELECT 100.0 * (SUM({mesure.sql}) FILTER (WHERE annee = {annee_b})
                    - SUM({mesure.sql}) FILTER (WHERE annee = {annee_a}))
                    / SUM({mesure.sql}) FILTER (WHERE annee = {annee_a}) AS variation_pct
      FROM eco2mix
      WHERE annee IN ({annee_a}, {annee_b})

    result:
      columns: [variation_pct]
      order_matters: false
