# Family "multi_condition": count the hours or days on which several conditions hold together.

templates:
  - template_id: mc_hours_share_above_region_year
    family: multi_condition
    conventions: [hours_from_steps, share_at_each_step]
    description: >
      Hours in a year during which one source covered more than a given share of a region's
      consumption. The traps are counting steps as hours (each step is half an hour) and
      averaging a share instead of testing it step by step.

    slots:
      mesure:
        from: measures
        keep: {kind: production}
      seuil:
        values:
          - {id: 25, ratio: 0.25, label: {fr: 25 %, it: 25%}}
          - {id: 50, ratio: 0.5, label: {fr: 50 %, it: 50%}}
          - {id: 75, ratio: 0.75, label: {fr: 75 %, it: 75%}}
      region:
        from: regions
      annee:
        range: [2013, 2025]

    max_instances: 35

    questions:
      fr:
        - "Pendant combien d'heures l'énergie {mesure} a-t-elle couvert plus de {seuil} de la consommation {region.in} en {annee} ?"
        - "Nombre d'heures {region.in} en {annee} où la production {mesure} a dépassé {seuil} de la consommation ?"
        - "Combien d'heures, en {annee}, la part {mesure.de} a-t-elle dépassé {seuil} de la consommation {region.in} ?"
        - "Donne-moi le nombre d'heures où la production {mesure} a couvert plus de {seuil} de la consommation {region.in} en {annee}."
        - "{region.in} en {annee} : combien d'heures avec une part {mesure.de} supérieure à {seuil} de la consommation ?"
        - "Nombre d'heures {region.in} en {annee} avec une couverture {mesure} de plus de {seuil} ?"
      it:
        - "Per quante ore l'energia {mesure} ha coperto più del {seuil} del consumo {region.in} nel {annee}?"
        - "Numero di ore {region.in} nel {annee} in cui la produzione {mesure} ha superato il {seuil} del consumo?"
        - "Quante ore, nel {annee}, la quota {mesure.de} ha superato il {seuil} del consumo {region.in}?"
        - "Dammi il numero di ore in cui la produzione {mesure} ha coperto più del {seuil} del consumo {region.in} nel {annee}."
        - "{region.in} nel {annee}: quante ore con una quota {mesure.de} superiore al {seuil} del consumo?"
        - "Numero di ore {region.in} nel {annee} con una copertura {mesure} superiore al {seuil}?"

    # The threshold must be crossed on some steps and missed on others. A count of 0 (a marginal
    # source against 75 %) or of every step (nuclear against 25 % in Centre-Val de Loire) is the
    # same answer for many wrong queries, e.g. one with the wrong threshold, so it proves nothing.
    require: |
      SELECT count(*) FILTER (WHERE {mesure.sql} > {seuil.ratio} * consommation_mw)
             BETWEEN 1 AND count(*) - 1
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}

    sql: |
      SELECT count(*) * 0.5 AS heures
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}
        AND {mesure.sql} > {seuil.ratio} * consommation_mw

    result:
      columns: [heures]
      order_matters: false

  - template_id: mc_days_national_consumption_above
    family: multi_condition
    conventions: [national_per_instant, days_count]
    description: >
      Days of a year on which national consumption exceeded a threshold at least once. The
      national value exists only once the 12 regions are summed per instant: comparing a
      regional row with 70 GW finds nothing, and summing over the whole day finds too much.

    slots:
      seuil:
        # `le` carries the article Italian needs before the number ("i 70 GW", "gli 80 GW");
        # French takes no article there, so both keys hold the bare figure.
        values:
          - {id: 60, mw: 60000, label: {fr: 60 GW, it: 60 GW}, le: {fr: 60 GW, it: i 60 GW}}
          - {id: 70, mw: 70000, label: {fr: 70 GW, it: 70 GW}, le: {fr: 70 GW, it: i 70 GW}}
          - {id: 80, mw: 80000, label: {fr: 80 GW, it: 80 GW}, le: {fr: 80 GW, it: gli 80 GW}}
      annee:
        range: [2013, 2025]

    max_instances: 35

    questions:
      fr:
        - "Combien de jours en {annee} la consommation nationale a-t-elle dépassé {seuil} ?"
        - "Nombre de jours de {annee} où la consommation électrique française a dépassé {seuil} ?"
        - "En {annee}, combien de journées ont connu une consommation supérieure à {seuil} en France ?"
        - "Donne-moi le nombre de jours de {annee} où la consommation nationale a dépassé {seuil}."
        - "{annee} : combien de jours au-dessus de {seuil} pour la consommation française ?"
        - "Sur combien de jours de {annee} la puissance consommée en France a-t-elle dépassé {seuil} ?"
      it:
        - "Quanti giorni del {annee} il consumo nazionale ha superato {seuil.le}?"
        - "Numero di giorni del {annee} in cui il consumo elettrico francese ha superato {seuil.le}?"
        - "Nel {annee}, in quanti giorni la Francia ha avuto un consumo superiore a {seuil}?"
        - "Dammi il numero di giorni del {annee} in cui il consumo nazionale ha superato {seuil.le}."
        - "{annee}: quanti giorni sopra {seuil} per il consumo francese?"
        - "In quanti giorni del {annee} la potenza consumata in Francia ha superato {seuil.le}?"

    sql: |
      WITH national AS (
        SELECT date, date_heure, SUM(consommation_mw) AS conso_mw
        FROM eco2mix
        WHERE annee = {annee}
        GROUP BY date, date_heure
      )
      SELECT count(DISTINCT date) AS jours
      FROM national
      WHERE conso_mw > {seuil.mw}

    result:
      columns: [jours]
      order_matters: false

  - template_id: mc_days_national_energy_above
    family: multi_condition
    conventions: [unit_decides_power_or_energy, energy_conversion, daily_total, days_count]
    description: >
      Twin of mc_days_national_consumption_above, with the threshold in GWh instead of GW.
      The first variant of each language is worded identically, so the unit alone tells a
      power compared at each instant from an energy summed over the day (glossary §1).

    slots:
      seuil:
        # French and Italian write thousands differently; `le` adds the Italian article.
        values:
          - {id: 1400, gwh: 1400, label: {fr: 1 400 GWh, it: 1.400 GWh}, le: {fr: 1 400 GWh, it: i 1.400 GWh}}
          - {id: 1600, gwh: 1600, label: {fr: 1 600 GWh, it: 1.600 GWh}, le: {fr: 1 600 GWh, it: i 1.600 GWh}}
          - {id: 1800, gwh: 1800, label: {fr: 1 800 GWh, it: 1.800 GWh}, le: {fr: 1 800 GWh, it: i 1.800 GWh}}
      annee:
        range: [2013, 2025]

    max_instances: 35

    # NOT a copy-paste: the first variant of each language repeats, word for word, the first
    # variant of mc_days_national_consumption_above above. Only {seuil} differs once rendered
    # ("80 GW" there, "1 400 GWh" here), so the unit alone must tell power from energy.
    questions:
      fr:
        - "Combien de jours en {annee} la consommation nationale a-t-elle dépassé {seuil} ?"
        - "Nombre de jours de {annee} où la consommation électrique française a dépassé {seuil} sur la journée ?"
        - "En {annee}, combien de journées ont vu la France consommer plus de {seuil} ?"
        - "Donne-moi le nombre de jours de {annee} où la France a consommé plus de {seuil}."
        - "{annee} : combien de journées à plus de {seuil} consommés en France ?"
        - "Sur combien de jours de {annee} le total consommé en France a-t-il dépassé {seuil} ?"
      it:
        - "Quanti giorni del {annee} il consumo nazionale ha superato {seuil.le}?"
        - "Numero di giorni del {annee} in cui il consumo elettrico francese ha superato {seuil.le} nell'arco della giornata?"
        - "Nel {annee}, in quanti giorni la Francia ha consumato più di {seuil}?"
        - "Dammi il numero di giorni del {annee} in cui la Francia ha consumato più di {seuil}."
        - "{annee}: quante giornate oltre {seuil.le} consumati in Francia?"
        - "In quanti giorni del {annee} il totale consumato in Francia ha superato {seuil.le}?"

    sql: |
      SELECT count(*) AS jours
      FROM (
        SELECT date
        FROM eco2mix
        WHERE annee = {annee}
        GROUP BY date
        HAVING SUM(consommation_mw) * 0.5 / 1000 > {seuil.gwh}
      )

    result:
      columns: [jours]
      order_matters: false

  - template_id: mc_hours_source_beats_source_season
    family: multi_condition
    conventions: [hours_from_steps, season, column_comparison]
    description: >
      Hours of one season during which one source produced more than another in a region.
      Combines the fixed season boundaries, a comparison between two columns of the same row,
      and the conversion of steps into hours.

    slots:
      mesure_a:
        from: measures
        keep: {kind: production}
      mesure_b:
        from: measures
        keep: {kind: production}
      region:
        from: regions
      saison:
        from: seasons
      annee:
        range: [2014, 2025]   # 2013 excluded: winter starts in the previous year

    constraints:
      - "mesure_a != mesure_b"

    max_instances: 35

    questions:
      fr:
        - "Pendant combien d'heures la production {mesure_a} a-t-elle dépassé la production {mesure_b} {region.in} {saison.in} {annee} ?"
        - "Nombre d'heures où la production {mesure_a} a été supérieure à la production {mesure_b} {region.in} {saison.in} {annee} ?"
        - "Combien d'heures, {saison.in} {annee}, la production {mesure_a} a-t-elle surpassé la production {mesure_b} {region.in} ?"
        - "Donne-moi le nombre d'heures où la production {mesure_a} a dépassé la production {mesure_b} {region.in} {saison.in} {annee}."
        - "{saison.in} {annee} {region.in} : combien d'heures de production {mesure_a} supérieure à la production {mesure_b} ?"
        - "Durée, en heures, où la production {mesure_a} est passée devant la production {mesure_b} {region.in} {saison.in} {annee} ?"
      it:
        - "Per quante ore la produzione {mesure_a} ha superato la produzione {mesure_b} {region.in} {saison.in} {annee}?"
        - "Numero di ore in cui la produzione {mesure_a} è stata maggiore della produzione {mesure_b} {region.in} {saison.in} {annee}?"
        - "Quante ore, {saison.in} {annee}, la produzione {mesure_a} ha superato quella {mesure_b} {region.in}?"
        - "Dammi il numero di ore in cui la produzione {mesure_a} ha superato la produzione {mesure_b} {region.in} {saison.in} {annee}."
        - "{saison.in} {annee} {region.in}: quante ore di produzione {mesure_a} superiore alla produzione {mesure_b}?"
        - "Durata, in ore, in cui la produzione {mesure_a} è passata davanti alla produzione {mesure_b} {region.in} {saison.in} {annee}?"

    # Both sources must exist, and each must lead on some steps: "thermal above bioenergy in
    # every hour of the winter" is also the answer of a query that forgets the comparison.
    require: |
      SELECT count(DISTINCT {mesure_a.sql}) > 1 AND count(DISTINCT {mesure_b.sql}) > 1
         AND count(*) FILTER (WHERE {mesure_a.sql} > {mesure_b.sql}) BETWEEN 1 AND count(*) - 1
      FROM eco2mix
      WHERE region = {region.literal} AND date BETWEEN '{saison.start}' AND '{saison.end}'

    sql: |
      SELECT count(*) * 0.5 AS heures
      FROM eco2mix
      WHERE region = {region.literal}
        AND date BETWEEN '{saison.start}' AND '{saison.end}'
        AND {mesure_a.sql} > {mesure_b.sql}

    result:
      columns: [heures]
      order_matters: false

  - template_id: mc_days_net_role_region_year
    family: multi_condition
    conventions: [exchange_sign, daily_total, days_count]
    description: >
      Days of a year on which a region was a net exporter (or importer) over the whole day.
      The condition is on a daily total, so the rows are grouped by date and filtered with
      HAVING; the sign of ech_physiques decides the role.

    slots:
      region:
        from: regions
      annee:
        range: [2013, 2025]
      role:
        values:
          - {id: export, op: "<", label: {fr: exportatrice nette, it: esportatrice netta}}
          - {id: import, op: ">", label: {fr: importatrice nette, it: importatrice netta}}

    max_instances: 35

    questions:
      fr:
        - "Combien de jours en {annee} la région {region} a-t-elle été {role} ?"
        - "Sur l'année {annee}, pendant combien de jours la région {region} a-t-elle été {role} d'électricité ?"
        - "Nombre de journées de {annee} où la région {region} a été {role} ?"
        - "Donne-moi le nombre de jours de {annee} où la région {region} a été {role}."
        - "{annee} : la région {region} a été {role} pendant combien de jours ?"
        - "Sur l'ensemble de {annee}, combien de jours la région {region} s'est-elle retrouvée {role} ?"
      it:
        - "Per quanti giorni del {annee} la regione {region} è stata {role}?"
        - "Quanti giorni nel {annee} la regione {region} è stata {role} di elettricità?"
        - "Nel {annee}, in quanti giorni la regione {region} è risultata {role}?"
        - "Dammi il numero di giorni del {annee} in cui la regione {region} è stata {role}."
        - "{annee}: per quante giornate la regione {region} è stata {role}?"
        - "Su tutto il {annee}, quanti giorni la regione {region} si è trovata {role}?"

    # The region must hold each role on some days: "PACA was a net importer on 365 days" is
    # also the answer of a query that ignores the sign and counts every day.
    require: |
      SELECT count(*) FILTER (WHERE solde {role.op} 0) BETWEEN 1 AND count(*) - 1
      FROM (
        SELECT date, SUM(ech_physiques_mw) AS solde
        FROM eco2mix
        WHERE region = {region.literal} AND annee = {annee}
        GROUP BY date
      )

    sql: |
      SELECT count(*) AS jours
      FROM (
        SELECT date
        FROM eco2mix
        WHERE region = {region.literal} AND annee = {annee}
        GROUP BY date
        HAVING SUM(ech_physiques_mw) {role.op} 0
      )

    result:
      columns: [jours]
      order_matters: false

  - template_id: mc_hours_share_of_production_above_region_year
    family: multi_condition
    conventions: [hours_from_steps, share_at_each_step, total_production]
    description: >
      Hours in a year during which one source made more than a given share of a region's total
      production: the share is tested at each step against the sum of the six sources, and
      each step counts half an hour. Train only: coverage rule, decisions.md 2026-10-08.
    train_only: true

    slots:
      mesure:
        from: measures
        keep: {kind: production}
      seuil:
        values:
          - {id: 25, ratio: 0.25, label: {fr: 25 %, it: 25%}}
          - {id: 50, ratio: 0.5, label: {fr: 50 %, it: 50%}}
          - {id: 75, ratio: 0.75, label: {fr: 75 %, it: 75%}}
      region:
        from: regions
      annee:
        range: [2013, 2025]

    max_instances: 35

    # A share of the total production, not of the consumption (mc_hours_share_above_region_year).
    must_say:
      fr: ["production totale"]
      it: ["produzione totale"]
    must_not_say:
      fr: ["consomm*", "couv*"]
      it: ["consum*", "copert*"]

    questions:
      fr:
        - "{region.in} en {annee}, pendant combien de temps, en heures, l'énergie {mesure} a-t-elle fourni plus de {seuil} de la production totale ?"
        - "Total d'heures en {annee} où l'énergie {mesure} dépassait {seuil} de la production totale {region.in} ?"
        - "Durée en heures, {region.in} sur {annee}, pendant laquelle la part {mesure.de} dépassait {seuil} de la production totale ?"
        - "Compte les heures de {annee} pendant lesquelles l'énergie {mesure} a représenté plus de {seuil} de la production totale {region.in}."
        - "Production totale {region.in} en {annee} : sur combien d'heures la part {mesure.de} y a-t-elle dépassé {seuil} ?"
        - "En heures, combien de temps en {annee} l'énergie {mesure} a-t-elle compté pour plus de {seuil} de la production totale {region.in} ?"
      it:
        - "{region.in} nel {annee}, per quanto tempo, in ore, l'energia {mesure} ha fornito più del {seuil} della produzione totale?"
        - "Totale di ore nel {annee} con l'energia {mesure} oltre il {seuil} della produzione totale {region.in}?"
        - "Durata in ore, {region.in} nel {annee}, in cui la quota {mesure.de} superava il {seuil} della produzione totale?"
        - "Conta le ore del {annee} durante le quali l'energia {mesure} ha rappresentato più del {seuil} della produzione totale {region.in}."
        - "Produzione totale {region.in} nel {annee}: per quante ore la quota {mesure.de} ha superato il {seuil}?"
        - "In ore, per quanto tempo nel {annee} l'energia {mesure} ha contato per più del {seuil} della produzione totale {region.in}?"

    require: |
      SELECT count(*) FILTER (WHERE {mesure.sql} > {seuil.ratio} * (
               COALESCE(thermique_mw, 0) + COALESCE(nucleaire_mw, 0) + COALESCE(eolien_mw, 0)
               + COALESCE(solaire_mw, 0) + COALESCE(hydraulique_mw, 0) + COALESCE(bioenergies_mw, 0)))
             BETWEEN 1 AND count(*) - 1
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}

    sql: |
      SELECT count(*) * 0.5 AS heures
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}
        AND {mesure.sql} > {seuil.ratio} * (
              COALESCE(thermique_mw, 0) + COALESCE(nucleaire_mw, 0) + COALESCE(eolien_mw, 0)
              + COALESCE(solaire_mw, 0) + COALESCE(hydraulique_mw, 0) + COALESCE(bioenergies_mw, 0))

    result:
      columns: [heures]
      order_matters: false

  - template_id: mc_time_share_source_above_consumption_region_year
    family: multi_condition
    conventions: [share_at_each_step]
    description: >
      Share of the time, in percent, during which one source covered more than a given share
      of a region's consumption over a year: the condition is tested at each step and the
      steps that meet it are counted against all steps. Train only: coverage rule,
      decisions.md 2026-10-08.
    train_only: true

    slots:
      mesure:
        from: measures
        keep: {kind: production}
      seuil:
        values:
          - {id: 25, ratio: 0.25, label: {fr: 25 %, it: 25%}}
          - {id: 50, ratio: 0.5, label: {fr: 50 %, it: 50%}}
          - {id: 75, ratio: 0.75, label: {fr: 75 %, it: 75%}}
      region:
        from: regions
      annee:
        range: [2013, 2025]

    max_instances: 35

    # A share of the time, not a number of hours (mc_hours_share_above_region_year).
    must_say:
      fr: ["temps"]
      it: ["tempo"]
    must_not_say:
      fr: ["heure*", "nombre"]
      it: ["ore", "numero"]

    questions:
      fr:
        - "Sur l'année {annee}, quelle fraction du temps a vu l'énergie {mesure} couvrir plus de {seuil} de la consommation {region.in} ?"
        - "Pourcentage du temps de {annee} où la production {mesure} excédait {seuil} de la consommation {region.in} ?"
        - "{region.in} en {annee} : pendant quel pourcentage du temps la production {mesure} a-t-elle couvert plus de {seuil} de la consommation ?"
        - "Donne-moi la part du temps où la production {mesure} a dépassé {seuil} de la consommation {region.in} en {annee}."
        - "Proportion du temps {region.in} en {annee} où la couverture {mesure} passait au-dessus de {seuil} de la consommation ?"
        - "En {annee} {region.in}, combien de temps, en pourcentage, la production {mesure} a-t-elle couvert plus de {seuil} de la consommation ?"
      it:
        - "Nell'anno {annee}, quale frazione del tempo ha visto l'energia {mesure} coprire più del {seuil} del consumo {region.in}?"
        - "Che percentuale del tempo, nel {annee}, la produzione {mesure} ha superato il {seuil} del consumo {region.in}?"
        - "{region.in} nel {annee}: per quale percentuale del tempo la produzione {mesure} ha coperto più del {seuil} del consumo?"
        - "Dammi la quota di tempo in cui la produzione {mesure} ha superato il {seuil} del consumo {region.in} nel {annee}."
        - "Proporzione del tempo {region.in} nel {annee} in cui la copertura {mesure} superava il {seuil} del consumo?"
        - "Nel {annee} {region.in}, per quanto tempo, in percentuale, la produzione {mesure} ha coperto più del {seuil} del consumo?"

    require: |
      SELECT count(*) FILTER (WHERE {mesure.sql} > {seuil.ratio} * consommation_mw)
             BETWEEN 1 AND count(*) - 1
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}

    sql: |
      SELECT 100.0 * count(*) FILTER (WHERE {mesure.sql} > {seuil.ratio} * consommation_mw)
             / count(*) AS part_du_temps_pct
      FROM eco2mix
      WHERE region = {region.literal} AND annee = {annee}

    result:
      columns: [part_du_temps_pct]
      order_matters: false
