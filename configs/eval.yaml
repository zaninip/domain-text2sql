# Evaluation run (phase 3). Paths are relative to the repository root.
# One run = one model, one split, one mode; the pilot runs this twice, changing `model` only.

model: Qwen/Qwen3-1.7B           # pilot alternative: Qwen/Qwen2.5-Coder-1.5B-Instruct
split: val                       # val for the model pilot; test only for the final baseline
mode: zero_shot                  # zero_shot | few_shot
limit: null                      # evaluate the first N examples only (local smoke tests)

few_shot:                        # used in few_shot mode only
  seed: 0                        # one train example per family (9), languages alternating
  ids:                           # the draw of seed 0 on the d3 train split (coverage rule, 2026-10-08)
    - agg_pumping_energy_region_year#0060#fr#1
    - avg_daily_energy_region_month#0002#it#1
    - cls_main_source_per_region_year#0008#fr#0
    - cmp_winter_summer_consumption_ratio_region#0025#it#2
    - ext_record_day_consumption_national_year#0015#fr#0
    - mc_days_net_role_region_year#0045#it#2
    - rank_top_sources_national_year#0008#fr#0
    - rate_offshore_share_national_month#0004#it#2
    - ts_cumulative_consumption_national_year#0016#fr#5

generation:
  max_new_tokens: 256            # greedy; the same budget for every configuration
  batch_size: 8
  dtype: float16                 # T4 has no bf16; no 4-bit quantization at evaluation time

paths:
  domain: domains/eco2mix
  database: data/eco2mix.duckdb
  splits: data/dataset
  predictions: results/predictions
