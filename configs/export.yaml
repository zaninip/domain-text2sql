# Export to GGUF (phase 5). Paths are relative to the repository root.

base: Qwen/Qwen3-1.7B            # the base weights of every evaluation
# the adapter kept on validation and evaluated on test (docs/decisions.md, 2026-10-14)
adapter: zaninip/eco2mix-sql-Qwen3-1.7B-d3-r16-lr0.0002-s0@step100
dtype: float16                   # the precision of the merge evaluated on the T4

llama_cpp:                       # conversion script and llama-quantize, at one fixed build
  tag: b11669                    # = release v0.7.0 (2026-10-15)
  binaries: llama-b11669-bin-win-cpu-x64.zip   # prebuilt CPU tools for Windows
  sha256: 37b3efcf962847ca869745fd4ccf7f5e7e8dacfeff9fa3523b4ca8cdc66d632b

# same settings for both models, so that the demo compares them fairly; plain quantization,
# without an importance matrix (which would need a choice of calibration text)
quantizations: [Q4_K_M, Q8_0]

paths:
  hf: data/export/hf             # fine-tuned/ (base + adapter) and base/, Hugging Face format
  llama_cpp: data/export/llama.cpp
  gguf: data/export/gguf

publish:                         # python -m t2sql.export.publish (HF_TOKEN with write access)
  private: true                  # made public by hand, once the pages are checked on the Hub
  adapter_repo: zaninip/qwen3-1.7b-eco2mix-sql
  gguf_repo: zaninip/qwen3-1.7b-eco2mix-sql-GGUF
  model_card: docs/model_card.md
  gguf_card: docs/model_card_gguf.md
  gguf_files:                    # file in paths.gguf -> name in the repo
    fine-tuned-Q4_K_M.gguf: qwen3-1.7b-eco2mix-sql-Q4_K_M.gguf
    base-Q4_K_M.gguf: qwen3-1.7b-base-Q4_K_M.gguf
