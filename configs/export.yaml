  binaries: llama-b11669-bin-win-cpu-x64.zip   # prebuilt CPU tools for Windows
  sha256: 37b3efcf962847ca869745fd4ccf7f5e7e8dacfeff9fa3523b4ca8cdc66d632b

paths:
  merged: data/export/merged     # base + adapter, Hugging Face format
